[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hcfp5090"
version = "0.1.0"
description = "Heterogeneous collective floorplanning with GPU dynamics and disjunctive projection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hcfp = "hcfp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
